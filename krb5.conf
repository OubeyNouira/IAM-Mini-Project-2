[libdefaults]
    default_realm = POLYCORP.TEST
    dns_lookup_realm = false
    dns_lookup_kdc = false
    rdns = false
    forwardable = true
    udp_preference_limit = 1

[realms]
    POLYCORP.TEST = {
        kdc = 192.168.6.128:88
        admin_server = 192.168.6.128:749
    }

[domain_realm]
    .polycorp.test = POLYCORP.TEST
    polycorp.test = POLYCORP.TEST